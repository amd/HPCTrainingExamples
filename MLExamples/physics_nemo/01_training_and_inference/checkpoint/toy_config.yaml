# Toy-scale training config for the LIVE training demo in the notebook
# (section 5) — same model architecture and loss as the real run, but a
# tiny epoch count and the 8-run train / 2-run holdout split shipped in
# this folder, so the notebook can run a real (if statistically
# meaningless) training loop in a few minutes.
#
# This is NOT the config used to produce checkpoint/checkpoints/ — that's
# config.yaml (the real 220-sample / 200-epoch run). This file is only for
# the "taste of training" cell. Paths are relative to the
# `01_training_and_inference/` folder root.
reader:
  _target_: vtp_reader.Reader
  _convert_: all
datapipe:
  _target_: datapipe.CrashPointCloudDataset
  _convert_: all
  data_dir: ${training.raw_data_dir}
  global_features_filepath: ${training.global_features_filepath}
  num_samples: ${training.num_training_samples}
  num_steps: ${training.num_time_steps}
  sample_type: all_time_steps
  static_features: []
  dynamic_features: []
  dynamic_targets:
  - effective_plastic_strain
  - stress_vm
  global_features:
  - velocity_x
  - crash_box_thick_scale
  - beam_thick_scale
  - rwall_origin_y
  stats_dir: results/notebook/toy_stats
model:
  _target_: rollout.GeoTransolverOneShot
  _convert_: all
  functional_dim: 3
  out_dim: 250
  geometry_dim: 3
  global_dim: 4
  slice_num: 128
  n_layers: 6
  use_te: false
  time_input: false
  include_local_features: true
  num_time_steps: ${training.num_time_steps}
  attention_type: GALE_FA
training:
  raw_data_dir: data/vtp_train
  raw_data_dir_validation: data/vtp_holdout
  global_features_filepath: data/global_features.json
  max_workers_preprocessing: 8
  optimizer: muon
  optimizer_weight_decay: 0.0001
  num_time_steps: 51
  num_training_samples: 8
  num_validation_samples: 2
  start_lr: 0.0001
  end_lr: 0.00003
  epochs: 30
  validation_freq: 10
  save_checkpoint_freq: 30
  amp: true
  num_dataloader_workers: 2
  ckpt_path: checkpoint/toy_checkpoints
  tensorboard_log_dir: checkpoint/toy_tensorboard_logs
  displacement_loss_alpha: 2.0
  peak_loss_weight: 0.5
  peak_loss_top_k: 50
  peak_plastic_strain_loss_weight: 0.5
inference:
  output_dir_pred: ./predicted_vtps
  output_dir_exact: ./exact_vtps
  raw_data_dir_test: data/vtp_holdout
experiment_name: Bumper-GeoFLARE-2D-Thickness-Toy
